[package]
name = "golf-lab"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
golf-core = { workspace = true }
golf-course = { workspace = true }
golf-shot = { workspace = true }
golf-flight = { workspace = true }
golf-ground = { workspace = true }
golf-impact = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libm = { workspace = true }

# `conform` links the generator's reference reader (its crate and its dependencies) to check our height function
# against it. Off by default: it needs ../GolfProceduralGenerator checked out next to this repo.
course-bundle = { path = "../../../GolfProceduralGenerator/crates/course-bundle", optional = true }

[features]
conform = ["dep:course-bundle"]
